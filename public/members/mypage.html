<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page - ぶいえぬパレット</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="../index.html">
                    <img src="../assets/logo.png" alt="Community Logo">
                    <h1>ぶいえぬパレット</h1>
                </a>
            </div>
            <nav class="main-nav" aria-label="Primary Navigation">
                <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
                    <span class="hamburger-icon"></span>
                </button>
                <ul class="nav-list">
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="/auth/login.html">ログイン</a></li>
                    <li><a href="/auth/register.html" aria-current="page">登録</a></li>
                </ul>
            </nav>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light and dark mode">
                <svg class="sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <h2>マイページ</h2>
                <p>本名と所属情報を登録・更新できます。</p>
            </div>
        </section>

        <section style="padding: 40px 0;">
            <div class="container" style="max-width: 720px;">
                <div id="not-logged" style="display:none;">
                    <p>このページを利用するにはログインが必要です。</p>
                    <p><a class="button" href="../auth/login.html">ログインページへ</a></p>
                </div>

                <div id="not-approved" style="display:none;">
                    <p>無料会員枠として自動承認を行っています。数秒後に再確認します…</p>
                </div>

                <form id="profile-form" class="login-form" style="display:none;">
                    <div class="form-group">
                        <label for="fullName">本名</label>
                        <input id="fullName" type="text" placeholder="例）山田 太郎" required />
                    </div>
                    <div class="form-group">
                        <label>所属区分</label>
                        <div style="display:flex; gap:16px; flex-wrap:wrap;">
                            <label><input type="radio" name="role" value="獣医師" /> 獣医師</label>
                            <label><input type="radio" name="role" value="愛玩動物看護師" /> 愛玩動物看護師</label>
                            <label><input type="radio" name="role" value="その他" /> その他</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="organization">所属先名称</label>
                        <input id="organization" type="text" placeholder="例）〇〇動物病院 / 会社名 など" />
                    </div>
                    <div class="form-group" style="display:flex; gap:12px; align-items:center;">
                        <button id="saveProfile" type="submit" class="button button-primary">保存する</button>
                        <span id="saveStatus" aria-live="polite"></span>
                    </div>
                    <p style="font-size:0.9rem; color:var(--muted-text);">登録メール: <span id="accountEmail"></span></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 ぶいえぬパレット. All rights reserved. | <a href="https://docs.google.com/forms/d/e/1FAIpQLSfWWqJWGEMWqquubh6pBwDXgUY6hTQ4X3TON0o3k2ap6kPYiw/viewform?usp=sf_link" target="_blank" rel="noopener noreferrer">登録解除</a></p>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
